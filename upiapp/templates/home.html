            <!-- User Info -->
            <div class="text-end">
                <h6 class="mb-0 fw-bold">amitispro</h6>
                <small class="text-muted">amit.baliarsingh04@gmail.com</small>

            <!-- Circular Profile Logo Placeholder -->
